<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나와 닮은 동물 찾기 - 성향 분석 테스트</title>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --sub-text: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: space-between; padding: 20px; line-height: 1.6; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px 24px; text-align: center; margin: auto 0; }
        .icon-header { font-size: 60px; margin-bottom: 12px; }
        h1 { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        p.description { font-size: 15px; color: var(--sub-text); margin-bottom: 24px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background-color: var(--primary); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn:hover { background-color: var(--primary-hover); }
        .option-btn { background-color: #f1f5f9; color: var(--text); margin-bottom: 12px; text-align: left; padding: 16px 20px; }
        .option-btn:hover { background-color: #e2e8f0; }
        .page { display: none; }
        .page.active { display: block; }
        .progress-bar { width: 100%; height: 8px; background-color: #e2e8f0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .progress { height: 100%; width: 0%; background-color: var(--primary); transition: width 0.3s ease; }
        footer { margin-top: 30px; font-size: 13px; color: var(--sub-text); text-align: center; }
        footer a { color: var(--primary); text-decoration: none; }

        /* GA4 동의 안내 배너 */
        .consent-banner {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1e293b; color: white; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1); z-index: 1000;
        }
        .consent-text { font-size: 13px; color: #cbd5e1; text-align: center; }
        .consent-btns { display: flex; gap: 8px; width: 100%; max-width: 300px; }
        .consent-btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-accept { background-color: var(--primary); color: white; }
        .btn-deny { background-color: #475569; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div id="page-start" class="page active">
            <div class="icon-header">🐶🐱🦊</div>
            <h1>나와 닮은 동물 찾기</h1>
            <p class="description">간단한 3개 질문으로 알아보는 나의 성향 분석 테스트!</p>
            <button class="btn" onclick="startTest()">테스트 시작하기</button>
        </div>

        <div id="page-q1" class="page">
            <div class="progress-bar"><div class="progress" style="width: 33%;"></div></div>
            <p class="description">Q1. 주말에 약속이 없을 때 나는?</p>
            <button class="btn option-btn" onclick="selectAnswer('E', 'q1')">집에 있으면 답답하다, 일단 밖으로 나간다!</button>
            <button class="btn option-btn" onclick="selectAnswer('I', 'q1')">이불 밖은 위험해! 하루 종일 누워서 쉰다.</button>
        </div>

        <div id="page-q2" class="page">
            <div class="progress-bar"><div class="progress" style="width: 66%;"></div></div>
            <p class="description">Q2. 새로운 프로젝트를 시작할 때 나는?</p>
            <button class="btn option-btn" onclick="selectAnswer('E', 'q2')">사람들과 대화하며 아이디어를 얻는다.</button>
            <button class="btn option-btn" onclick="selectAnswer('I', 'q2')">혼자 깊게 조사하고 계획부터 세운다.</button>
        </div>

        <div id="page-q3" class="page">
            <div class="progress-bar"><div class="progress" style="width: 100%;"></div></div>
            <p class="description">Q3. 친구가 고민을 상담할 때 나의 반응은?</p>
            <button class="btn option-btn" onclick="selectAnswer('E', 'q3')">열심히 공감해 주고 기분을 풀어준다.</button>
            <button class="btn option-btn" onclick="selectAnswer('I', 'q3')">원인을 분석하고 해결책을 제안한다.</button>
        </div>

        <div id="page-result" class="page">
            <div class="icon-header" id="result-emoji">🎉</div>
            <h1>분석 결과</h1>
            <div style="background: #f8fafc; border-radius: 12px; padding: 20px; margin: 20px 0;">
                <div id="result-title" style="font-size:20px; font-weight:bold; color:var(--primary);"></div>
                <p id="result-desc" style="font-size: 14px; color: #475569; margin-top: 8px;"></p>
            </div>
            <button class="btn" onclick="restartTest()">다시 테스트하기</button>
        </div>
    </div>

    <!-- GA4 동의 안내 배너 -->
    <div id="consent-banner" class="consent-banner">
        <div class="consent-text">
            본 사이트는 유입 분석을 위해 Google Analytics 4를 사용합니다. 데이터 수집에 동의하시겠습니까?
        </div>
        <div class="consent-btns">
            <button class="consent-btn btn-accept" onclick="acceptGA()">동의함</button>
            <button class="consent-btn btn-deny" onclick="denyGA()">거부함</button>
        </div>
    </div>

    <footer>
        <p>© 2026 Animal Personality Test.</p>
        <p><a href="privacy.html">개인정보처리방침 (Privacy Policy)</a></p>
    </footer>

    <script>
        let isGAAllowed = false;
        let scores = { E: 0, I: 0 };

        // GA4 동의 / 거부 처리
        function acceptGA() {
            isGAAllowed = true;
            document.getElementById('consent-banner').style.display = 'none';
            loadGA4();
        }

        function denyGA() {
            isGAAllowed = false;
            document.getElementById('consent-banner').style.display = 'none';
        }

        // 동의 시에만 전달해주신 진짜 GA4 측정 ID(G-020J2KB24N) 로드
        function loadGA4() {
            let script = document.createElement('script');
            script.async = true;
            script.src = "https://www.googletagmanager.com/gtag/js?id=G-020J2KB24N";
            document.head.appendChild(script);

            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', 'G-020J2KB24N');
        }

        function sendGAEvent(eventName, params = {}) {
            if (isGAAllowed && typeof window.gtag === 'function') {
                window.gtag('event', eventName, params);
            }
        }

        function startTest() {
            scores = { E: 0, I: 0 };
            document.getElementById('page-start').classList.remove('active');
            document.getElementById('page-q1').classList.add('active');
            sendGAEvent('quiz_start', { 'quiz_name': 'animal_personality' });
        }

        function selectAnswer(type, questionId) {
            scores[type]++;
            sendGAEvent('quiz_progress', { 'question_id': questionId, 'selected_option': type });

            if (questionId === 'q1') {
                document.getElementById('page-q1').classList.remove('active');
                document.getElementById('page-q2').classList.add('active');
            } else if (questionId === 'q2') {
                document.getElementById('page-q2').classList.remove('active');
                document.getElementById('page-q3').classList.add('active');
            } else if (questionId === 'q3') {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('page-q3').classList.remove('active');
            document.getElementById('page-result').classList.add('active');

            let animal = scores.E >= 2 ? "친근하고 활발한 '골든리트리버'" : "신중하고 차분한 '은둔 고양이'";
            let emoji = scores.E >= 2 ? "🐶" : "🐱";
            let desc = scores.E >= 2 ? "에너지가 넘치는 인싸 타입입니다!" : "혼자만의 시간을 소중히 여기는 전략가 타입입니다!";

            document.getElementById('result-title').innerText = animal;
            document.getElementById('result-emoji').innerText = emoji;
            document.getElementById('result-desc').innerText = desc;

            sendGAEvent('quiz_complete', { 'quiz_result': animal });
        }

        function restartTest() {
            document.getElementById('page-result').classList.remove('active');
            document.getElementById('page-start').classList.add('active');
        }
    </script>
</body>
</html>
